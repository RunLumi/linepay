name: LinePay

options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: com.streamentry
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.6"
  projectFormat: xcode16_0
  defaultConfig: Debug
  createIntermediateGroups: true
  defaultSourceDirectoryType: syncedFolder

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    revision: f110d97d84f7a3a2fe89b897d63c814c538f695e
  LinePayDomain:
    path: Packages/LinePayDomain

fileGroups:
  - README.md
  - Config

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    LOCALIZED_STRING_SWIFTUI_SUPPORT: YES
    SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  LinePay:
    build:
      targets:
        LinePay: all
        LinePayAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - LinePay
      targets:
        - name: LinePayAppTests
          parallelizable: true
    archive:
      config: Release

targets:
  LinePay:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App/Sources
        type: syncedFolder
      - path: App/Resources
        type: group
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.streamentry.linepay
        PRODUCT_NAME: LinePay
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: LinePaycheck
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_CFBundleName: LinePaycheck
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan a paystub on this device for a paycheck audit."
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: LinePayDomain

  LinePayAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AppTests/Sources
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamentry.linepay.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LinePay
      - package: LinePayDomain
      - package: ViewInspector

name: Normalize iOS feature branch

on:
  push:
    branches:
      - feat/ios-1.0-e2e

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/ios-1.0-e2e
          fetch-depth: 0

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Normalize public brand copy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('apps/ios/App/Sources')
          for path in root.glob('*.swift'):
              text = path.read_text()
              text = text.replace('LinePay ', 'LinePaycheck ')
              text = text.replace('LinePay-', 'LinePaycheck-')
              path.write_text(text)
          PY

      - name: Format Swift
        run: swift format --in-place --recursive apps/ios

      - name: Commit normalization
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ios
          git commit -m "style: normalize LinePaycheck copy and Swift format"
          git push origin HEAD:feat/ios-1.0-e2e

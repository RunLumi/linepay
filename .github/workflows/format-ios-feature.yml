name: Audit iOS feature branch

on:
  push:
    branches:
      - feat/ios-1.0-e2e

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-26
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/ios-1.0-e2e
          fetch-depth: 0

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: User-facing brand references
        run: |
          echo '=== LinePay references in app source ==='
          grep -RIn 'LinePay' apps/ios/App/Sources || true

      - name: Full iOS gate
        run: bash scripts/check-ios.sh

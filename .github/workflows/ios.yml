name: iOS

on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "shared/contracts/**"
      - "scripts/check-ios.sh"
      - ".swift-format"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - "shared/contracts/**"
      - "scripts/check-ios.sh"
      - ".swift-format"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodegen --version

      - name: Lint, test, and build
        run: bash scripts/check-ios.sh

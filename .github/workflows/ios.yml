name: iOS

on:
  push:
    branches: [dev, testing]
    paths:
      - "apps/ios/**"
      - ".maestro/**"
      - "shared/contracts/**"
      - "scripts/**"
      - ".swift-format"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - ".maestro/**"
      - "shared/contracts/**"
      - "scripts/**"
      - ".swift-format"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: linepay-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: linepay-ios
    timeout-minutes: 20
    env:
      # StoreKit's local test daemon is stable on the installed iOS 18.5 runtime.
      IOS_SIMULATOR_DESTINATION: platform=iOS Simulator,id=6CB95D1F-BC8E-4C06-B8C4-606F58AA02A9
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        run: |
          if [[ -d /Applications/Xcode_26.6.app ]]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
          elif [[ -d /Applications/Xcode.app ]]; then
            echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          else
            echo "error: Xcode 26.6 installation not found" >&2
            exit 1
          fi
      - name: Install pinned XcodeGen 2.46.0
        run: |
          XCODEGEN_PREFIX="$HOME/.local" bash scripts/install-xcodegen.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Reset synthetic app data on the pinned simulator
        run: |
          UDID="${IOS_SIMULATOR_DESTINATION##*id=}"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl uninstall "$UDID" com.streamentry.linepay 2>/dev/null || true
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodegen --version
      - name: Lint, test, and build
        run: |
          mkdir -p .test-results
          set -o pipefail
          bash scripts/check-ios.sh 2>&1 | tee .test-results/verification.log
      - name: Retain resolved test dependencies and assertion diagnostics
        if: always()
        run: |
          mkdir -p .test-results
          if [[ -d apps/ios/LinePay.xcodeproj ]]; then
            find apps/ios/LinePay.xcodeproj -name Package.resolved -exec cp '{}' .test-results/Package.resolved \;
          fi
          if [[ -d .test-results/AppTests.xcresult ]]; then
            xcrun xcresulttool get test-results summary --path .test-results/AppTests.xcresult > .test-results/test-summary.json
            xcrun xcresulttool get test-results tests --path .test-results/AppTests.xcresult > .test-results/test-details.json
          fi
      - name: Retain test results and per-file coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-tests-${{ github.sha }}
          path: .test-results/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  ui:
    name: UI (${{ matrix.name }})
    needs: check
    runs-on: linepay-ios
    timeout-minutes: 40
    env:
      MAESTRO_CLI_NO_ANALYTICS: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: standard-light
            device: QC iPhone 17 Pro v2
            appearance: light
            text: large
            target: .maestro
          - name: compact-dark-large-text
            device: LinePay Release iPhone 18
            appearance: dark
            text: accessibility-extra-extra-extra-large
            target: .maestro/flows/rule-scope.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select native tools
        run: |
          if [[ -d /Applications/Xcode_26.6.app ]]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
          elif [[ -d /Applications/Xcode.app ]]; then
            echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          else
            echo "error: Xcode 26.6 installation not found" >&2
            exit 1
          fi
          XCODEGEN_PREFIX="$HOME/.local" bash scripts/install-xcodegen.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$(/usr/libexec/java_home -v 17)" >> "$GITHUB_ENV"
      - name: Install verified Maestro 2.7.0
        run: |
          MAESTRO_CACHE="$HOME/.cache/linepay/maestro-2.7.0.zip"
          mkdir -p "$(dirname "$MAESTRO_CACHE")"
          if [[ ! -f "$MAESTRO_CACHE" ]]; then
            TMP_ARCHIVE="$MAESTRO_CACHE.tmp.$$"
            curl --fail --location --connect-timeout 30 --max-time 900 --retry 3 --retry-all-errors \
              -o "$TMP_ARCHIVE" \
              https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.7.0/maestro.zip
            mv "$TMP_ARCHIVE" "$MAESTRO_CACHE"
          fi
          echo "a4ccab6b604617e7aef6db4f885666056eabe5cfa32befaa3bc994041b8fcbb5  $MAESTRO_CACHE" | shasum -a 256 -c -
          unzip -q "$MAESTRO_CACHE" -d "$RUNNER_TEMP/maestro-cli"
          mkdir -p "$HOME/.maestro"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - name: Prepare test appearance and device
        env:
          DEVICE_NAME: ${{ matrix.device }}
          APPEARANCE: ${{ matrix.appearance }}
          TEXT_SIZE: ${{ matrix.text }}
        run: |
          UDID=$(xcrun simctl list devices available | grep -F "$DEVICE_NAME (" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [[ -z "$UDID" ]]; then
            echo "error: pinned UI simulator is unavailable: $DEVICE_NAME" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl uninstall "$UDID" com.streamentry.linepay 2>/dev/null || true
          xcrun simctl ui "$UDID" appearance "$APPEARANCE"
          xcrun simctl ui "$UDID" content_size "$TEXT_SIZE"
          echo "MAESTRO_IOS_DEVICE=$DEVICE_NAME" >> "$GITHUB_ENV"
          echo "UI_DEVICE_UDID=$UDID" >> "$GITHUB_ENV"
          maestro --version
      - name: Run real application journeys
        run: bash scripts/test-ios-maestro.sh '${{ matrix.target }}'
      - name: Check compact audit verdict
        if: matrix.name == 'compact-dark-large-text'
        run: maestro --udid "$UI_DEVICE_UDID" test --test-output-dir .build/maestro-audit-results .maestro/flows/audit-scope.yaml
      - name: Retain rendered screenshots and flow results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-ui-${{ matrix.name }}-${{ github.sha }}
          path: |
            .build/maestro-results/
            .build/maestro-audit-results/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

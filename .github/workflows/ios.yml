name: iOS

on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "shared/contracts/**"
      - "scripts/**"
      - ".swift-format"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - "shared/contracts/**"
      - "scripts/**"
      - ".swift-format"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Install pinned XcodeGen 2.46.0
        run: |
          XCODEGEN_PREFIX="$HOME/.local" bash scripts/install-xcodegen.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodegen --version
      - name: Lint, test, and build
        run: |
          mkdir -p .test-results
          set -o pipefail
          bash scripts/check-ios.sh 2>&1 | tee .test-results/verification.log
      - name: Retain resolved test dependencies and assertion diagnostics
        if: always()
        run: |
          mkdir -p .test-results
          if [[ -d apps/ios/LinePay.xcodeproj ]]; then
            find apps/ios/LinePay.xcodeproj -name Package.resolved -exec cp '{}' .test-results/Package.resolved \;
          fi
          if [[ -d .test-results/AppTests.xcresult ]]; then
            xcrun xcresulttool get test-results summary --path .test-results/AppTests.xcresult > .test-results/test-summary.json
            xcrun xcresulttool get test-results tests --path .test-results/AppTests.xcresult > .test-results/test-details.json
          fi
      - name: Retain test results and per-file coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-tests-${{ github.sha }}
          # Only synthetic test results are included; never upload the full workspace.
          path: .test-results/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

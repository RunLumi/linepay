name: Apply and verify readiness repair
on:
  push:
    branches: [fix/ios-1.0-readiness]
    paths: [.github/workflows/apply-readiness.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'streamentry/linepay' && github.ref == 'refs/heads/fix/ios-1.0-readiness'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select pinned Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Apply hash-verified source delta
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          chunks = [root / '.delivery' / f'chunk{i:02}.b64' for i in range(8)]
          compressed = base64.b64decode(''.join(p.read_text() for p in chunks), validate=True)
          expected = '6ca9a8f5d8b0346a7f05e31c21c9f1f488a6676e3e83d6da9892c8d9c2b585cd'
          assert hashlib.sha256(compressed).hexdigest() == expected, 'Delivery checksum mismatch'
          payload = json.loads(lzma.decompress(compressed))
          prepared = []
          for name, change in payload.items():
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert path.parts[0] in ('apps', 'scripts', 'docs', '.maestro', '.github', 'shared')
              target = root / path
              assert not target.is_symlink()
              old = target.read_bytes() if target.exists() else None
              current_hash = hashlib.sha256(old).hexdigest() if old is not None else None
              if not change.get('delete') and current_hash == change['after']:
                  continue
              assert current_hash == change['before'], f'Source drift: {name}'
              if change.get('delete'):
                  prepared.append((target, None))
                  continue
              lines = (old or b'').decode('utf-8').splitlines(keepends=True)
              pieces = []
              for op in change['ops']:
                  if isinstance(op, str):
                      pieces.append(op)
                  else:
                      start, end = op
                      assert 0 <= start <= end <= len(lines)
                      pieces.extend(lines[start:end])
              data = ''.join(pieces).encode('utf-8')
              assert hashlib.sha256(data).hexdigest() == change['after'], f'Output mismatch: {name}'
              prepared.append((target, data))
          for target, data in prepared:
              if data is None:
                  target.unlink()
              else:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          for target, data in prepared:
              if data is not None and target.suffix == '.swift':
                  subprocess.run(['swift', 'format', 'format', '-i', '--configuration', '.swift-format', str(target)], check=True)
          print(f'Applied {len(prepared)} validated source changes')
          PY
      - name: Commit source on repair branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps scripts docs .maestro shared
          if ! git diff --cached --quiet; then
            git commit -m 'fix: implement evidence-aware payroll, durable payday lifecycle, and readiness regression suite'
            git push origin HEAD:refs/heads/fix/ios-1.0-readiness
          fi
          git rev-parse HEAD
      - name: Install pinned XcodeGen
        run: |
          XCODEGEN_PREFIX="$HOME/.local" bash scripts/install-xcodegen.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify native app and critical UI journeys
        env:
          LINEPAY_RESULTS_DIR: ${{ runner.temp }}/linepay-results
        run: |
          set -o pipefail
          mkdir -p "$LINEPAY_RESULTS_DIR"
          bash scripts/check-ios.sh 2>&1 | tee "$LINEPAY_RESULTS_DIR/native-check.log"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: readiness-native-results
          path: ${{ runner.temp }}/linepay-results
          retention-days: 3
          if-no-files-found: ignore

name: Commit reviewed readiness boundary fixes
on:
  push:
    branches: [fix/ios-1.0-readiness]
    paths: [.github/workflows/commit-readiness-boundaries.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'streamentry/linepay' && github.ref == 'refs/heads/fix/ios-1.0-readiness'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Apply exactly the reviewed source patch
        run: |
          echo 'fa2222a9942161e2fbca96a3210d30107d3804cc5ad6c5b15e157171cdb3b050  scripts/readiness-boundaries.patch' | shasum -a 256 -c -
          test "$(git hash-object apps/ios/App/Sources/AppModel.swift)" = d686a9e3c4df2827edde67a4ff9829f5aca019a3
          git apply --check scripts/readiness-boundaries.patch
          git apply scripts/readiness-boundaries.patch
          swift format format -i --configuration .swift-format apps/ios/App/Sources/AppModel.swift apps/ios/AppTests/Sources/ReadinessBoundaryTests.swift
          git rm scripts/readiness-boundaries.patch
          git add apps/ios/App/Sources/AppModel.swift apps/ios/AppTests/Sources/ReadinessBoundaryTests.swift
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve evidence cleanup and period boundaries during timezone changes'
          git push origin HEAD:refs/heads/fix/ios-1.0-readiness
      - name: Install pinned XcodeGen
        run: |
          XCODEGEN_PREFIX="$HOME/.local" bash scripts/install-xcodegen.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify the committed source
        env:
          LINEPAY_RESULTS_DIR: ${{ runner.temp }}/linepay-results
        run: |
          set -o pipefail
          mkdir -p "$LINEPAY_RESULTS_DIR"
          git rev-parse HEAD > "$LINEPAY_RESULTS_DIR/commit.txt"
          bash scripts/check-ios.sh 2>&1 | tee "$LINEPAY_RESULTS_DIR/native-check.log"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: boundary-fix-results
          path: ${{ runner.temp }}/linepay-results
          retention-days: 3
          if-no-files-found: ignore

name: Finalize iOS timezone integrity v2

on:
  push:
    branches:
      - feat/ios-1.0-e2e

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/ios-1.0-e2e
          fetch-depth: 0
          persist-credentials: true

      - name: Patch timezone semantics and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} matches, found {count}: {old[:90]!r}"
                  )
              p.write_text(text.replace(old, new))

          model = 'apps/ios/App/Sources/AppModel.swift'

          replace(
              model,
              '''            regularStartTime = Self.clockDate(\n                hour: firstWindow.start.hour,\n                minute: firstWindow.start.minute\n            )\n            regularEndTime = Self.clockDate(\n                hour: firstWindow.end.hour,\n                minute: firstWindow.end.minute\n            )''',
              '''            regularStartTime = Self.clockDate(\n                hour: firstWindow.start.hour,\n                minute: firstWindow.start.minute,\n                timeZoneIdentifier: profile.timeZoneIdentifier\n            )\n            regularEndTime = Self.clockDate(\n                hour: firstWindow.end.hour,\n                minute: firstWindow.end.minute,\n                timeZoneIdentifier: profile.timeZoneIdentifier\n            )'''
          )
          replace(
              model,
              '''    private static func clockDate(hour: Int, minute: Int) -> Date {\n        var components = DateComponents()\n        components.year = 2001\n        components.month = 1\n        components.day = 1\n        components.hour = hour\n        components.minute = minute\n        return Calendar(identifier: .gregorian).date(from: components) ?? Date()\n    }''',
              '''    private static func clockDate(\n        hour: Int,\n        minute: Int,\n        timeZoneIdentifier: String = TimeZone.current.identifier\n    ) -> Date {\n        var calendar = Calendar(identifier: .gregorian)\n        calendar.timeZone = TimeZone(identifier: timeZoneIdentifier) ?? .current\n        var components = DateComponents()\n        components.timeZone = calendar.timeZone\n        components.year = 2001\n        components.month = 1\n        components.day = 1\n        components.hour = hour\n        components.minute = minute\n        return calendar.date(from: components) ?? Date()\n    }'''
          )
          replace(
              model,
              '''            let start = try localTime(from: draft.regularStartTime)\n            let end = try localTime(from: draft.regularEndTime)''',
              '''            let start = try localTime(\n                from: draft.regularStartTime,\n                timeZoneIdentifier: draft.timeZoneIdentifier\n            )\n            let end = try localTime(\n                from: draft.regularEndTime,\n                timeZoneIdentifier: draft.timeZoneIdentifier\n            )'''
          )
          replace(
              model,
              '''    private func localTime(from date: Date) throws -> LocalTime {\n        let components = Calendar(identifier: .gregorian).dateComponents(\n            [.hour, .minute], from: date)\n        return try LocalTime(\n            hour: components.hour ?? 0,\n            minute: components.minute ?? 0\n        )\n    }''',
              '''    private func localTime(\n        from date: Date,\n        timeZoneIdentifier: String\n    ) throws -> LocalTime {\n        guard let timeZone = TimeZone(identifier: timeZoneIdentifier) else {\n            throw AppModelError.invalidField("Time zone")\n        }\n        var calendar = Calendar(identifier: .gregorian)\n        calendar.timeZone = timeZone\n        let components = calendar.dateComponents([.hour, .minute], from: date)\n        return try LocalTime(\n            hour: components.hour ?? 0,\n            minute: components.minute ?? 0\n        )\n    }'''
          )

          replace(
              model,
              '''            candidate.activePeriod = ActivePayPeriod(\n                window: window,\n                agreement: agreement\n            )''',
              '''            candidate.activePeriod = ActivePayPeriod(\n                window: window,\n                agreement: agreement,\n                timeZoneIdentifier: draft.timeZoneIdentifier\n            )'''
          )
          replace(
              model,
              '''        candidate.activePeriod = ActivePayPeriod(\n            window: window,\n            agreement: profile.agreement\n        )''',
              '''        candidate.activePeriod = ActivePayPeriod(\n            window: window,\n            agreement: profile.agreement,\n            timeZoneIdentifier: profile.timeZoneIdentifier\n        )'''
          )
          replace(
              model,
              '''        let completed = CompletedPayPeriod(\n            id: active.id,\n            window: active.window,\n            agreement: active.agreement,\n            workEntries: active.workEntries,''',
              '''        let completed = CompletedPayPeriod(\n            id: active.id,\n            window: active.window,\n            agreement: active.agreement,\n            timeZoneIdentifier: active.agreementTimeZone(\n                fallback: profile.timeZoneIdentifier\n            ),\n            workEntries: active.workEntries,'''
          )
          replace(
              model,
              '''            candidate.activePeriod = ActivePayPeriod(\n                window: nextWindow,\n                agreement: profile.agreement\n            )''',
              '''            candidate.activePeriod = ActivePayPeriod(\n                window: nextWindow,\n                agreement: profile.agreement,\n                timeZoneIdentifier: profile.timeZoneIdentifier\n            )'''
          )
          replace(
              model,
              '''        let replacement = CompletedPayPeriod(\n            id: original.id,\n            window: original.window,\n            agreement: original.agreement,\n            workEntries: original.workEntries,''',
              '''        let replacement = CompletedPayPeriod(\n            id: original.id,\n            window: original.window,\n            agreement: original.agreement,\n            timeZoneIdentifier: original.timeZoneIdentifier,\n            workEntries: original.workEntries,'''
          )
          replace(
              model,
              '''extension ActivePayPeriod {\n    fileprivate func agreementTimeZone(fallback: String?) -> String {\n        fallback ?? TimeZone.current.identifier\n    }\n}''',
              '''extension ActivePayPeriod {\n    fileprivate func agreementTimeZone(fallback: String?) -> String {\n        if let timeZoneIdentifier {\n            return timeZoneIdentifier\n        }\n        if let workTimeZone = workEntries.first?.interval.timeZoneIdentifier {\n            return workTimeZone\n        }\n        return fallback ?? TimeZone.current.identifier\n    }\n}'''
          )
          replace(
              model,
              '''    var isOnboarded: Bool { state.profile != nil }\n    var recoveryFileURL: URL? { store.recoveryFileURL }''',
              '''    var isOnboarded: Bool { state.profile != nil }\n    var recoveryFileURL: URL? { store.recoveryFileURL }\n\n    var currentTimeZoneIdentifier: String {\n        state.activePeriod?.agreementTimeZone(fallback: profile?.timeZoneIdentifier)\n            ?? profile?.timeZoneIdentifier\n            ?? TimeZone.current.identifier\n    }\n\n    func timeZoneIdentifier(for period: CompletedPayPeriod) -> String {\n        period.timeZoneIdentifier\n            ?? period.workEntries.first?.interval.timeZoneIdentifier\n            ?? profile?.timeZoneIdentifier\n            ?? TimeZone.current.identifier\n    }'''
          )
          replace(
              model,
              '''    private var activeTimeZoneIdentifier: String {\n        profile?.timeZoneIdentifier ?? TimeZone.current.identifier\n    }''',
              '''    private var activeTimeZoneIdentifier: String {\n        currentTimeZoneIdentifier\n    }'''
          )

          replace(
              model,
              '''        guard let calculation = calculate(period: active) else {\n            throw AppModelError.calculationUnavailable\n        }\n\n        let gross = try positiveDecimal(draft.grossPay, field: "Gross pay", allowZero: true)''',
              '''        guard let calculation = calculate(period: active) else {\n            throw AppModelError.calculationUnavailable\n        }\n\n        let periodTimeZoneIdentifier = active.agreementTimeZone(\n            fallback: profile?.timeZoneIdentifier\n        )\n        let expectedStart = localDate(\n            from: active.window.startDate,\n            timeZoneIdentifier: periodTimeZoneIdentifier\n        )\n        let expectedEnd = localDate(\n            from: active.window.displayEndDate,\n            timeZoneIdentifier: periodTimeZoneIdentifier\n        )\n        if let providedStart = draft.payPeriodStartDate.map({\n            localDate(from: $0, timeZoneIdentifier: periodTimeZoneIdentifier)\n        }), providedStart != expectedStart {\n            throw AppModelError.invalidPayPeriod\n        }\n        if let providedEnd = draft.payPeriodEndDate.map({\n            localDate(from: $0, timeZoneIdentifier: periodTimeZoneIdentifier)\n        }), providedEnd != expectedEnd {\n            throw AppModelError.invalidPayPeriod\n        }\n\n        let gross = try positiveDecimal(draft.grossPay, field: "Gross pay", allowZero: true)'''
          )
          replace(
              model,
              'timeZoneIdentifier: activeTimeZoneIdentifier',
              'timeZoneIdentifier: periodTimeZoneIdentifier',
              expected=2
          )

          setup = 'apps/ios/App/Sources/PayProfileSetupView.swift'
          replace(
              setup,
              '''        .environment(\\.timeZone, selectedTimeZone)\n        .tint(LinePayColor.brandPrimary)''',
              '''        .environment(\\.timeZone, selectedTimeZone)\n        .onChange(of: draft.timeZoneIdentifier) { oldIdentifier, newIdentifier in\n            rebaseDraftDates(from: oldIdentifier, to: newIdentifier)\n        }\n        .tint(LinePayColor.brandPrimary)'''
          )
          replace(
              setup,
              '''    private var selectedTimeZone: TimeZone {\n        TimeZone(identifier: draft.timeZoneIdentifier) ?? .current\n    }\n\n    private func save() {''',
              '''    private var selectedTimeZone: TimeZone {\n        TimeZone(identifier: draft.timeZoneIdentifier) ?? .current\n    }\n\n    private func rebaseDraftDates(from oldIdentifier: String, to newIdentifier: String) {\n        guard oldIdentifier != newIdentifier else { return }\n        draft.regularStartTime = rebaseTime(\n            draft.regularStartTime,\n            from: oldIdentifier,\n            to: newIdentifier\n        )\n        draft.regularEndTime = rebaseTime(\n            draft.regularEndTime,\n            from: oldIdentifier,\n            to: newIdentifier\n        )\n        draft.periodStartDate = rebaseDate(\n            draft.periodStartDate,\n            from: oldIdentifier,\n            to: newIdentifier\n        )\n        draft.manualPeriodEndDate = rebaseDate(\n            draft.manualPeriodEndDate,\n            from: oldIdentifier,\n            to: newIdentifier\n        )\n        draft.effectiveStartDate = rebaseDate(\n            draft.effectiveStartDate,\n            from: oldIdentifier,\n            to: newIdentifier\n        )\n        draft.effectiveEndDate = rebaseDate(\n            draft.effectiveEndDate,\n            from: oldIdentifier,\n            to: newIdentifier\n        )\n        for index in draft.datePremiums.indices {\n            draft.datePremiums[index].date = rebaseDate(\n                draft.datePremiums[index].date,\n                from: oldIdentifier,\n                to: newIdentifier\n            )\n        }\n    }\n\n    private func rebaseTime(\n        _ date: Date,\n        from oldIdentifier: String,\n        to newIdentifier: String\n    ) -> Date {\n        var oldCalendar = Calendar(identifier: .gregorian)\n        oldCalendar.timeZone = TimeZone(identifier: oldIdentifier) ?? .current\n        var newCalendar = Calendar(identifier: .gregorian)\n        newCalendar.timeZone = TimeZone(identifier: newIdentifier) ?? .current\n        let values = oldCalendar.dateComponents([.hour, .minute], from: date)\n        var components = DateComponents()\n        components.timeZone = newCalendar.timeZone\n        components.year = 2001\n        components.month = 1\n        components.day = 1\n        components.hour = values.hour\n        components.minute = values.minute\n        return newCalendar.date(from: components) ?? date\n    }\n\n    private func rebaseDate(\n        _ date: Date,\n        from oldIdentifier: String,\n        to newIdentifier: String\n    ) -> Date {\n        var oldCalendar = Calendar(identifier: .gregorian)\n        oldCalendar.timeZone = TimeZone(identifier: oldIdentifier) ?? .current\n        var newCalendar = Calendar(identifier: .gregorian)\n        newCalendar.timeZone = TimeZone(identifier: newIdentifier) ?? .current\n        var components = oldCalendar.dateComponents([.year, .month, .day], from: date)\n        components.timeZone = newCalendar.timeZone\n        return newCalendar.date(from: components) ?? date\n    }\n\n    private func save() {'''
          )

          replace(
              'apps/ios/App/Sources/TodayView.swift',
              '''            if let profile = model.profile {\n                Text(\n                    LinePayFormat.payPeriod(\n                        active.window, timeZoneIdentifier: profile.timeZoneIdentifier)\n                )\n                .font(.subheadline)\n                .foregroundStyle(LinePayColor.textSecondary)\n            }''',
              '''            Text(\n                LinePayFormat.payPeriod(\n                    active.window,\n                    timeZoneIdentifier: model.currentTimeZoneIdentifier\n                )\n            )\n            .font(.subheadline)\n            .foregroundStyle(LinePayColor.textSecondary)'''
          )
          replace(
              'apps/ios/App/Sources/PayLedgerView.swift',
              '''            if let profile = model.profile {\n                Text(\n                    LinePayFormat.payPeriod(\n                        active.window, timeZoneIdentifier: profile.timeZoneIdentifier)\n                )\n                .font(.subheadline)\n                .foregroundStyle(LinePayColor.textSecondary)\n            }''',
              '''            Text(\n                LinePayFormat.payPeriod(\n                    active.window,\n                    timeZoneIdentifier: model.currentTimeZoneIdentifier\n                )\n            )\n            .font(.subheadline)\n            .foregroundStyle(LinePayColor.textSecondary)'''
          )
          replace(
              'apps/ios/App/Sources/PayLedgerView.swift',
              '''                        timeZoneIdentifier: model.profile?.timeZoneIdentifier\n                            ?? TimeZone.current.identifier,''',
              '''                        timeZoneIdentifier: model.currentTimeZoneIdentifier,'''
          )
          replace(
              'apps/ios/App/Sources/HistoryView.swift',
              '''model.profile?.timeZoneIdentifier\n                        ?? TimeZone.current.identifier''',
              '''model.timeZoneIdentifier(for: period)''',
              expected=3
          )
          replace(
              'apps/ios/App/Sources/PaystubImportView.swift',
              '''        .tint(LinePayColor.brandPrimary)\n    }\n\n    private var periodStartBinding: Binding<Date> {''',
              '''        .environment(\\.timeZone, payrollTimeZone)\n        .tint(LinePayColor.brandPrimary)\n    }\n\n    private var payrollTimeZone: TimeZone {\n        TimeZone(identifier: model.currentTimeZoneIdentifier) ?? .current\n    }\n\n    private var periodStartBinding: Binding<Date> {'''
          )

          tests = 'apps/ios/AppTests/Sources/AppModelTests.swift'
          replace(
              tests,
              '''    private func makeDraft(rate: String, start: Date) -> PayProfileDraft {''',
              '''    @Test("Regular schedule wall-clock time uses the payroll timezone")\n    func regularScheduleUsesPayrollTimeZone() throws {\n        let model = AppModel()\n        var draft = makeDraft(rate: "50", start: testStart)\n        draft.useRegularSchedule = true\n        draft.regularWeekdays = [.monday]\n\n        var payrollCalendar = Calendar(identifier: .gregorian)\n        payrollCalendar.timeZone = try #require(TimeZone(identifier: "America/Los_Angeles"))\n        draft.regularStartTime = try #require(\n            payrollCalendar.date(\n                from: DateComponents(year: 2001, month: 1, day: 1, hour: 7, minute: 0)\n            )\n        )\n        draft.regularEndTime = try #require(\n            payrollCalendar.date(\n                from: DateComponents(year: 2001, month: 1, day: 1, hour: 15, minute: 30)\n            )\n        )\n\n        try model.saveProfile(draft)\n\n        let window = try #require(model.profile?.agreement.regularSchedule.first)\n        #expect(window.start.hour == 7)\n        #expect(window.start.minute == 0)\n        #expect(window.end.hour == 15)\n        #expect(window.end.minute == 30)\n    }\n\n    @Test("Archived pay period keeps its original payroll timezone")\n    func archivedPayPeriodKeepsTimeZone() throws {\n        let model = AppModel()\n        var draft = makeDraft(rate: "50", start: testStart)\n        try model.saveProfile(draft)\n        try model.addWork(\n            start: testStart,\n            end: testStart.addingTimeInterval(8 * 60 * 60),\n            kind: .regular\n        )\n        try model.archiveCurrentPeriod()\n\n        draft.timeZoneIdentifier = "America/New_York"\n        try model.saveProfile(draft)\n\n        let archived = try #require(model.history.first)\n        #expect(archived.timeZoneIdentifier == "America/Los_Angeles")\n        #expect(model.timeZoneIdentifier(for: archived) == "America/Los_Angeles")\n        #expect(model.activePeriod?.timeZoneIdentifier == "America/Los_Angeles")\n        #expect(model.profile?.timeZoneIdentifier == "America/New_York")\n    }\n\n    @Test("Paystub period dates must match the active pay period")\n    func paystubPeriodMismatchIsRejected() throws {\n        let model = AppModel()\n        try model.saveProfile(makeDraft(rate: "50", start: testStart))\n        try model.addWork(\n            start: testStart,\n            end: testStart.addingTimeInterval(8 * 60 * 60),\n            kind: .regular\n        )\n\n        var paystub = PaystubConfirmationDraft()\n        paystub.payPeriodStartDate = testStart.addingTimeInterval(24 * 60 * 60)\n        paystub.payPeriodEndDate = testStart.addingTimeInterval(6 * 24 * 60 * 60)\n        paystub.grossPay = "400"\n\n        #expect(throws: AppModelError.invalidPayPeriod) {\n            try model.confirmPaystub(paystub)\n        }\n        #expect(model.currentPaystub == nil)\n        #expect(!model.hasUsedFreeAudit)\n    }\n\n    private func makeDraft(rate: String, start: Date) -> PayProfileDraft {'''
          )
          PY

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Format Swift
        run: swift format --in-place --recursive apps/ios

      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ios
          git commit -m "fix: preserve payroll timezone semantics"
          git push origin HEAD:feat/ios-1.0-e2e

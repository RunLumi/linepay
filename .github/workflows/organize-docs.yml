name: Organize product documentation once
on:
  push:
    branches: [docs/product-payroll-handbook]
    paths: [.github/workflows/organize-docs.yml]
permissions:
  contents: write
jobs:
  organize:
    if: github.repository == 'streamentry/linepay' && github.ref == 'refs/heads/docs/product-payroll-handbook'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Apply documentation moves and routes
        run: |
          python3 docs/_tools/reorganize_2026_09.py
          rm docs/_tools/reorganize_2026_09.py
          # The runner has contents permission only. Do not write workflow files.
          git restore --source=HEAD -- .github/workflows/agent-harness.yml
          python3 - <<'PY'
          from pathlib import Path
          from decimal import Decimal
          p = Path('docs/release/evidence/release-build-2-2026-09-05.md')
          text = p.read_text()
          text = text.replace('](release-and-testflight-api.md)', '](../api-and-testflight.md)')
          text = text.replace('](testing.md)', '](../../testing/README.md)')
          p.write_text(text)
          p = Path('docs/product/payroll/worked-examples.md')
          text = p.read_text()
          old = '| EX-13 | Same complete week: 24h at $40 and 24h at $60; weighted method applicable | R $2,400; RR $50; extra $200; **$2,600** | Latest/highest or unweighted rate chosen blindly |'
          new = '| EX-13 | Same complete week: 30h at $40 and 20h at $60; weighted method applicable | R $2,400; RR $48; extra 10 × $24 = $240; **$2,640** | Unequal hours expose an incorrect unweighted average |'
          assert old in text, 'Unexpected example drift'
          p.write_text(text.replace(old, new))
          assert (Decimal(30)*40 + Decimal(20)*60)/50 == 48
          assert Decimal(2400) + Decimal('0.5')*48*10 == 2640
          PY
          git diff --check
      - name: Check links and documentation tooling
        run: |
          mkdir -p "$RUNNER_TEMP/docs-results"
          set -o pipefail
          python3 -m unittest discover -s docs/_tools -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/docs-results/tool-tests.log"
          python3 docs/_tools/check_links.py 2>&1 | tee "$RUNNER_TEMP/docs-results/links.log"
      - name: Validate agent routing
        run: |
          set -o pipefail
          bash scripts/check-agent-harness.sh 2>&1 | tee "$RUNNER_TEMP/docs-results/harness.log"
      - name: Commit documentation only
        run: |
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-m', '-o', '--exclude-standard'], text=True).splitlines()
          for p in paths:
              assert p.endswith('.md') or p.startswith('docs/') or p == 'scripts/check-agent-harness.sh', 'Unexpected non-documentation change: ' + p
          workflows = subprocess.check_output(['git', 'diff', '--name-only', '--', '.github/workflows'], text=True)
          assert not workflows.strip(), 'Workflow modifications exceed runner permissions'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: organize canonical guides, preserve audit evidence, and route agents'
          git push origin HEAD:refs/heads/docs/product-payroll-handbook
      - name: Capture exact committed documentation context
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/docs-results"
          git rev-parse HEAD > "$RUNNER_TEMP/docs-results/commit.txt"
          git archive --format=zip --output="$RUNNER_TEMP/docs-results/source.zip" HEAD
      - name: Preserve source and verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: product-docs-verification
          path: ${{ runner.temp }}/docs-results
          retention-days: 7
          if-no-files-found: error

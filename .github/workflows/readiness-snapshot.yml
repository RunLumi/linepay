name: Readiness source snapshot
on:
  push:
    branches: [fix/ios-1.0-readiness]
    paths: [.github/workflows/readiness-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=zip --output=/tmp/linepay-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linepay-readiness-source
          path: /tmp/linepay-source.zip
          retention-days: 1
          if-no-files-found: error

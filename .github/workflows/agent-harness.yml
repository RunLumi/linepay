name: Agent Harness

on:
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - ".gemini/**"
      - ".maestro/AGENTS.md"
      - ".github/agents/**"
      - ".github/instructions/**"
      - ".github/copilot-instructions.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".mcp.json"
      - ".xcodebuildmcp/**"
      - "apps/**/AGENTS.md"
      - "shared/contracts/AGENTS.md"
      - "docs/engineering/agentic-development.md"
      - "scripts/**"
      - "apps/ios/project.yml"
      - ".github/workflows/agent-harness.yml"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - ".gemini/**"
      - ".maestro/AGENTS.md"
      - ".github/agents/**"
      - ".github/instructions/**"
      - ".github/copilot-instructions.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".mcp.json"
      - ".xcodebuildmcp/**"
      - "apps/**/AGENTS.md"
      - "shared/contracts/AGENTS.md"
      - "docs/engineering/agentic-development.md"
      - "scripts/**"
      - "apps/ios/project.yml"
      - ".github/workflows/agent-harness.yml"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: agent-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate harness
        run: bash scripts/check-agent-harness.sh
      - name: Test repository scripts
        run: python3 -m unittest discover -s scripts/tests -v

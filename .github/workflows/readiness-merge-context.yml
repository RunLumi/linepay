name: Readiness merge context
on:
  push:
    branches: [fix/ios-1.0-readiness]
    paths: [.github/workflows/readiness-merge-context.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle tracked Git history only
        run: git bundle create /tmp/linepay-repair.bundle HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: readiness-merge-context
          path: /tmp/linepay-repair.bundle
          retention-days: 1
          if-no-files-found: error

name: Finalize iOS timezone integrity v3

on:
  push:
    branches:
      - feat/ios-1.0-e2e

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/ios-1.0-e2e
          fetch-depth: 0
          persist-credentials: true

      - name: Reuse guarded patch with corrected history count
        run: |
          awk '/python3 - <<'"'"'PY'"'"'/{capture=1; next} capture && /^          PY$/{exit} capture{sub(/^          /, ""); print}' \
            .github/workflows/finalize-ios-timezones-v2.yml > /tmp/timezone_patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/timezone_patch.py')
          text = path.read_text()
          needle = "'''model.timeZoneIdentifier(for: period)''',\n    expected=3"
          if needle not in text:
              raise SystemExit('expected History replacement count marker not found')
          path.write_text(text.replace(needle, "'''model.timeZoneIdentifier(for: period)''',\n    expected=1"))
          PY
          python3 /tmp/timezone_patch.py

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Format Swift
        run: swift format --in-place --recursive apps/ios

      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ios
          git commit -m "fix: preserve payroll timezone semantics"
          git push origin HEAD:feat/ios-1.0-e2e

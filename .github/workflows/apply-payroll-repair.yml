name: Apply payroll repair
on:
  push:
    branches: [fix/payroll-rule-and-audit-scope]
    paths: [.github/workflows/apply-payroll-repair.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/payroll-rule-and-audit-scope
      - name: Verify and apply exact source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib
          names=['part0','part1-fixed','part2','part3','part4','part5']
          parts=[]
          for name in names:
              text=''.join(Path('.repair-transfer',name).read_text().split())
              if name == 'part3':
                  text=text.replace('NyLJopn9Y','NyLJIoVPn9Y')
              print(name,len(text),hashlib.sha256(text.encode()).hexdigest())
              parts.append(text)
          encoded=''.join(parts)
          assert len(encoded)==35272, len(encoded)
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert len(raw)==125033, len(raw)
          assert hashlib.sha256(raw).hexdigest()=='b1e4a0687b0f69b7f614850e55a5724933b5664fe459c6903a57c893fa6a55d9'
          Path('/tmp/payroll.patch').write_bytes(raw)
          PY
          git apply --check /tmp/payroll.patch
          git apply /tmp/payroll.patch
          git rm apps/ios/AppTests/Sources/KnownProductGapTests.swift
          git rm -r .repair-transfer
          git add apps docs .maestro
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix effective-dated rule changes and component-aware paycheck verdicts'
          git push origin HEAD:fix/payroll-rule-and-audit-scope
      - name: Retain transport diagnostics on failure only
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: payroll-transfer-diagnostics
          path: .repair-transfer/
          include-hidden-files: true
          retention-days: 1

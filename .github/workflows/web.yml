name: Local browser client

on:
  pull_request:
    paths: ['apps/web/**', 'shared/contracts/**', 'tools/web-worker/**', '.github/workflows/web.yml']
  push:
    branches: [dev, testing]
    paths: ['apps/web/**', 'shared/contracts/**', 'tools/web-worker/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Exact domain, state and transport checks
        run: node --test apps/web/tests/*.test.mjs
      - name: Install pinned Worker development tooling
        run: npm --prefix tools/web-worker ci --ignore-scripts --no-audit --no-fund
      - name: Package runtime assets and validate Worker configuration
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm --prefix tools/web-worker run check:worker
          npm --prefix tools/web-worker run check:assets
      - name: Install isolated browser-test tools
        run: |
          python3 -m venv "$RUNNER_TEMP/web-qa-venv"
          "$RUNNER_TEMP/web-qa-venv/bin/pip" install -r apps/web/requirements-test.txt
          "$RUNNER_TEMP/web-qa-venv/bin/python" -m playwright install --with-deps chromium webkit
      - name: Chromium local workflow
        env:
          BROWSER: chromium
        run: '"$RUNNER_TEMP/web-qa-venv/bin/python" apps/web/tests/browser_e2e.py'
      - name: WebKit local workflow
        env:
          BROWSER: webkit
        run: '"$RUNNER_TEMP/web-qa-venv/bin/python" apps/web/tests/browser_e2e.py'
      - name: Chromium encrypted transfer workflow
        env:
          BROWSER: chromium
        run: '"$RUNNER_TEMP/web-qa-venv/bin/python" apps/web/tests/portable_browser_e2e.py'
      - name: WebKit encrypted transfer workflow
        env:
          BROWSER: webkit
        run: '"$RUNNER_TEMP/web-qa-venv/bin/python" apps/web/tests/portable_browser_e2e.py'
      - name: Actual Worker HTTP and browser policies
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          tools/web-worker/node_modules/.bin/wrangler dev --config apps/web/wrangler.jsonc --env staging --local --ip 127.0.0.1 --port 8787 > .build/web-worker/local-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/ > /dev/null; then break; fi
            sleep 1
          done
          node tools/web-worker/check-http.mjs http://127.0.0.1:8787/
          BROWSER=chromium "$RUNNER_TEMP/web-qa-venv/bin/python" tools/web-worker/check-browser.py http://127.0.0.1:8787/
          BROWSER=webkit "$RUNNER_TEMP/web-qa-venv/bin/python" tools/web-worker/check-browser.py http://127.0.0.1:8787/
      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-browser-qa-${{ github.sha }}
          path: |
            .build/web-e2e/**/report.json
            .build/web-e2e/**/*.png
            .build/web-e2e/**/failure.txt
            .build/web-e2e/**/synthetic-*-report.html
            .build/web-e2e/**/synthetic-*-report.pdf
            .build/web-portable-e2e/**
            .build/web-worker/asset-manifest.json
            .build/web-worker/local-worker.log
            .build/web-worker/browser-*/**
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

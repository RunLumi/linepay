name: Coverage source snapshot
on:
  push:
    branches: [test/coverage-completion]
    paths: [.github/workflows/coverage-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          git archive --format=zip --output=source.zip HEAD
          git rev-parse HEAD > source-head.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-source
          path: |
            source.zip
            source-head.txt
          retention-days: 1

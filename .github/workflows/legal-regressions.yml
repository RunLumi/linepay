name: Legal regressions
on:
  push:
    branches: [dev, testing]
    paths:
      - 'apps/ios/**'
      - 'scripts/**'
      - 'docs/legal/**'
      - '.github/workflows/legal-regressions.yml'
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'scripts/**'
      - 'docs/legal/**'
      - '.github/workflows/legal-regressions.yml'
permissions:
  contents: read
concurrency:
  group: linepay-ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  targeted-native:
    runs-on: linepay-ios
    timeout-minutes: 25
    env:
      IOS_SIMULATOR_DESTINATION: platform=iOS Simulator,id=0A8C774B-C1D3-4A43-816C-81D3D3D849D8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select pinned tools
        run: |
          if [[ -d /Applications/Xcode_26.6.app ]]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
          elif [[ -d /Applications/Xcode.app ]]; then
            echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          else
            echo "error: Xcode 26.6 installation not found" >&2
            exit 1
          fi
          XCODEGEN_PREFIX="$HOME/.local" bash scripts/install-xcodegen.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Reset synthetic app data on the pinned simulator
        run: |
          UDID="${IOS_SIMULATOR_DESTINATION##*id=}"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl uninstall "$UDID" com.streamentry.linepay 2>/dev/null || true
      - name: Run legal behavior and interaction regressions
        run: |
          set -euo pipefail
          mkdir -p .test-results
          swift format lint --strict --recursive --configuration .swift-format apps/ios
          LOCK='apps/ios/LinePay.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
          cp "$LOCK" "$RUNNER_TEMP/legal-Package.resolved"
          (cd apps/ios && xcodegen generate)
          cmp "$LOCK" "$RUNNER_TEMP/legal-Package.resolved"
          # Large-text scope evidence is a real simulator journey; keep it bounded while
          # allowing the pinned iPhone simulator enough time for all three scopes.
          xcodebuild -project apps/ios/LinePay.xcodeproj -scheme LinePay \
            -configuration Debug -destination "${IOS_SIMULATOR_DESTINATION}" \
            -onlyUsePackageVersionsFromResolvedFile -derivedDataPath "$RUNNER_TEMP/legal-derived" \
            -resultBundlePath .test-results/LegalTests.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 720 \
            -only-testing:LinePayAppTests/LegalRegressionTests \
            -only-testing:LinePayAppTests/LegalConsentAndReportTests \
            -only-testing:LinePayAppTests/ReportShareSessionTests \
            -only-testing:LinePayAppTests/NoOpenPeriodRuleTests \
            -only-testing:LinePayAppTests/ReportTransferTests \
            -only-testing:LinePayUITests/LegalJourneyTests \
            -only-testing:LinePayUITests/PaydayJourneyTests/testUnresolvedPeriodClosesAndNextPeriodRemainsIndependent \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee .test-results/legal-verification.log
          cmp "$LOCK" "$RUNNER_TEMP/legal-Package.resolved"
      - name: Extract test receipts
        if: always()
        run: |
          if [[ -d .test-results/LegalTests.xcresult ]]; then
            xcrun xcresulttool get test-results summary --path .test-results/LegalTests.xcresult > .test-results/legal-summary.json
            xcrun xcresulttool get test-results tests --path .test-results/LegalTests.xcresult > .test-results/legal-tests.json
            xcrun xcresulttool export attachments --path .test-results/LegalTests.xcresult --output-path .test-results/screenshots
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: legal-regressions-${{ github.sha }}
          path: .test-results/
          include-hidden-files: true
          retention-days: 7

appId: com.streamentry.linepay
name: Work correction, overlap review, and period-bound Undo
tags: [smoke, ios, regression]
---
- runFlow: ../helpers/onboard.yaml
- runFlow: ../helpers/add-work.yaml
- scrollUntilVisible:
    element:
      id: today.repeat-shift
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: today.repeat-shift
- waitForAnimationToEnd
# Repeat last shift proposes a free day in the open period (forward, else the latest earlier
# day) instead of opening on the logged day in conflict.
- scrollUntilVisible:
    element:
      id: repeat.save
- waitForAnimationToEnd
- assertVisible:
    id: repeat.save
    enabled: true
- assertNotVisible: ".*Overlaps.*"
- takeScreenshot: repeat-proposes-free-day
- tapOn:
    id: repeat.keep-draft
- waitForAnimationToEnd
# The overlap guard: a new entry at the same default times as the logged shift.
- scrollUntilVisible:
    element:
      id: today.add-work
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: today.add-work
- waitForAnimationToEnd
- scrollUntilVisible:
    element: ".*Overlaps.*"
    centerElement: true
- waitForAnimationToEnd
- assertVisible: ".*Overlaps.*"
- scrollUntilVisible:
    element:
      id: work.save
- waitForAnimationToEnd
- assertVisible:
    id: work.save
    enabled: false
- takeScreenshot: overlap-error
- tapOn:
    id: work.cancel
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: today.edit-work
- waitForAnimationToEnd
- tapOn:
    id: today.edit-work
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: work.note
- waitForAnimationToEnd
- tapOn:
    id: work.note
- waitForAnimationToEnd
- inputText: " QA correction "
- tapOn:
    id: keyboard.done
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: work.save
- waitForAnimationToEnd
- tapOn:
    id: work.save
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: today.edit-work
- waitForAnimationToEnd
- tapOn:
    id: today.edit-work
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: work.delete
- waitForAnimationToEnd
- tapOn:
    id: work.delete
- waitForAnimationToEnd
- assertVisible:
    id: today.undo-delete
- tapOn:
    id: today.undo-delete
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: today.edit-work
- waitForAnimationToEnd
- assertVisible: ".*QA correction.*"
- takeScreenshot: work-restored

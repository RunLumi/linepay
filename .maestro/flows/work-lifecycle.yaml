appId: com.streamentry.linepay
name: Work correction, overlap review, and period-bound Undo
tags: [smoke, ios, regression]
---
- runFlow: ../helpers/onboard.yaml
- runFlow: ../helpers/add-work.yaml
- scrollUntilVisible:
    element:
      id: today.repeat-shift
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: today.repeat-shift
- waitForAnimationToEnd
- scrollUntilVisible:
    element: ".*Overlaps.*"
    centerElement: true
- waitForAnimationToEnd
- assertVisible: ".*Overlaps.*"
- scrollUntilVisible:
    element:
      id: repeat.save
- waitForAnimationToEnd
- assertVisible:
    id: repeat.save
    enabled: false
- takeScreenshot: overlap-error
- scrollUntilVisible:
    element: Discard this draft
- waitForAnimationToEnd
- tapOn: Discard this draft
- waitForAnimationToEnd
- tapOn: Discard draft
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: today.edit-work
- waitForAnimationToEnd
- tapOn:
    id: today.edit-work
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: work.note
- waitForAnimationToEnd
- tapOn:
    id: work.note
- waitForAnimationToEnd
- inputText: " QA correction "
- tapOn:
    id: keyboard.done
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: work.save
- waitForAnimationToEnd
- tapOn:
    id: work.save
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: today.edit-work
- waitForAnimationToEnd
- tapOn:
    id: today.edit-work
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: work.delete
- waitForAnimationToEnd
- tapOn:
    id: work.delete
- waitForAnimationToEnd
- assertVisible:
    id: today.undo-delete
- tapOn:
    id: today.undo-delete
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: today.edit-work
- waitForAnimationToEnd
- assertVisible: ".*QA correction.*"
- takeScreenshot: work-restored

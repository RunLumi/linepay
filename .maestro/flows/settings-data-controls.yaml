appId: com.streamentry.linepay
name: Data deletion requires confirmation and resets the app
tags: [ios, regression, settings]
---
- runFlow: ../helpers/onboard.yaml
- runFlow: ../helpers/add-work.yaml
- tapOn: Settings
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: settings.privacy-data
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: settings.privacy-data
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: settings.delete-all
    timeout: 60000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: settings.delete-all
- waitForAnimationToEnd
- assertVisible:
    id: settings.confirm-delete-all
- takeScreenshot: delete-all-confirmation
- tapOn: Cancel
- waitForAnimationToEnd
- tapOn: Today
- waitForAnimationToEnd
- assertVisible:
    id: today.repeat-shift
- tapOn: Settings
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: settings.privacy-data
    commands:
      - scrollUntilVisible:
          element:
            id: settings.privacy-data
          centerElement: true
      - tapOn:
          id: settings.privacy-data
      - waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: settings.delete-all
    timeout: 60000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: settings.delete-all
- waitForAnimationToEnd
- tapOn:
    id: settings.confirm-delete-all
- waitForAnimationToEnd
- assertVisible:
    id: onboarding.set-up-pay
- stopApp
- launchApp
- assertVisible:
    id: onboarding.set-up-pay
- takeScreenshot: delete-all-complete

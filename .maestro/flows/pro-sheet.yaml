appId: com.streamentry.linepay
name: Pro options remain readable and dismissible
tags: [smoke, ios, regression]
---
- runFlow: ../helpers/onboard.yaml
- tapOn: Settings
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: settings.view-pro
- waitForAnimationToEnd
- tapOn:
    id: settings.view-pro
- waitForAnimationToEnd
- assertVisible:
    id: paywall.dismiss
- scrollUntilVisible:
    element:
      id: paywall.monthly
- waitForAnimationToEnd
- tapOn:
    id: paywall.monthly
- waitForAnimationToEnd
- assertVisible:
    id: paywall.purchase
    enabled: false
- takeScreenshot: pro-options
- scrollUntilVisible:
    element:
      id: paywall.restore
- waitForAnimationToEnd
- takeScreenshot: pro-terms
- scrollUntilVisible:
    element:
      id: paywall.terms
    direction: UP
    visibilityPercentage: 30
- waitForAnimationToEnd
- scroll
- takeScreenshot: pro-terms-end
- tapOn:
    id: paywall.dismiss
- waitForAnimationToEnd
- assertVisible:
    id: settings.view-pro
- tapOn: Today
- waitForAnimationToEnd
- assertVisible:
    id: today.add-work

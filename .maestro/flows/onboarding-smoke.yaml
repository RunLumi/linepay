appId: com.streamentry.linepay
name: Fresh install onboarding smoke
tags:
  - smoke
  - ios
---
- launchApp:
    clearState: true
- assertVisible:
    id: onboarding.set-up-pay
- tapOn:
    id: onboarding.set-up-pay
- assertVisible:
    id: pay-profile.hourly-rate
- tapOn:
    id: pay-profile.hourly-rate
- inputText: "58.40"
- tapOn:
    point: "50%,12%"
- assertVisible:
    id: pay-profile.save
- tapOn:
    id: pay-profile.save
- assertVisible:
    id: today.add-work
- takeScreenshot: onboarding-complete

appId: com.streamentry.linepay
name: Short viewport, long profile, and large money values
tags: [ios, regression, adaptive]
onFlowComplete:
  - setOrientation: PORTRAIT
---
- runFlow: ../helpers/onboard.yaml
- tapOn: Settings
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: settings.edit-rules
- waitForAnimationToEnd
- tapOn:
    id: settings.edit-rules
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: pay-profile.name
- waitForAnimationToEnd
- tapOn:
    id: pay-profile.name
- waitForAnimationToEnd
- eraseText
- inputText: "Synthetic QA profile with a deliberately long name for overnight storm restoration"
- tapOn:
    id: keyboard.done
- waitForAnimationToEnd
- runFlow: ../helpers/confirm-rules.yaml
- tapOn:
    id: pay-profile.confirm-change
- waitForAnimationToEnd
- tapOn: Today
- waitForAnimationToEnd
- takeScreenshot: long-profile
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd
- tapOn:
    id: today.add-work
    retryTapIfNoChange: true
- waitForAnimationToEnd
- setOrientation: PORTRAIT
- waitForAnimationToEnd
- tapOn:
    id: work.cancel
- waitForAnimationToEnd
- runFlow: ../helpers/add-work.yaml
- scrollUntilVisible:
    element:
      id: work.note
    direction: DOWN
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: work.note
- waitForAnimationToEnd
- inputText: Portrait QA draft
- tapOn:
    id: keyboard.done
- waitForAnimationToEnd
- tapOn:
    id: work.cancel
- waitForAnimationToEnd
- setOrientation: PORTRAIT
- runFlow: ../helpers/add-work.yaml
- scrollUntilVisible:
    element:
      id: today.open-pay
- waitForAnimationToEnd
- tapOn:
    id: today.open-pay
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: pay.check-paycheck
- waitForAnimationToEnd
- tapOn:
    id: pay.check-paycheck
- waitForAnimationToEnd
- runFlow:
    file: ../helpers/confirm-paystub.yaml
    env:
      GROSS: "9876543.21"
- assertVisible: Possible overpayment
- takeScreenshot: large-amount-comparison

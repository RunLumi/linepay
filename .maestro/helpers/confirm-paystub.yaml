appId: com.streamentry.linepay
---
- scrollUntilVisible:
    element:
      id: paystub.manual
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: paystub.manual
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: paystub.audit
    timeout: 60000
- waitForAnimationToEnd
- assertVisible:
    id: paystub.audit
    enabled: false
- scrollUntilVisible:
    element:
      id: paystub.field.periodStart
    direction: UP
    timeout: 60000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: paystub.field.periodStart
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: paystub.confirm-field
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: paystub.confirm-field
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: paystub.field.periodEnd
    timeout: 60000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: paystub.field.periodEnd
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: paystub.confirm-field
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: paystub.confirm-field
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: paystub.field.grossPay
    timeout: 60000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: paystub.field.grossPay
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: paystub.value
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: paystub.value
- waitForAnimationToEnd
- inputText: ${GROSS}
- tapOn:
    id: keyboard.done
- waitForAnimationToEnd
- takeScreenshot: manual-paystub-field
- scrollUntilVisible:
    element:
      id: paystub.confirm-field
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: paystub.confirm-field
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: paystub.complete-work
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: paystub.complete-work
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: paystub.gross-basis
    visibilityPercentage: 100
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: gross-basis-before-selection
- tapOn:
    id: paystub.gross-basis
    retryTapIfNoChange: true
- waitForAnimationToEnd
- tapOn: ".*Wages only.*"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: paystub.audit
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: paystub.audit
- waitForAnimationToEnd

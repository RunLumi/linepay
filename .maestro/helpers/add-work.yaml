appId: com.streamentry.linepay
---
- scrollUntilVisible:
    element:
      id: today.add-work
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: today.add-work
- waitForAnimationToEnd
- assertVisible:
    id: work.start
- takeScreenshot: work-form
- scrollUntilVisible:
    element:
      id: work.note
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: work.note
- waitForAnimationToEnd
- inputText: Synthetic QA shift
- tapOn:
    id: keyboard.done
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: work.save
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: work.save
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: activation.keep-logging
    timeout: 60000
- waitForAnimationToEnd
- assertVisible:
    id: activation.keep-logging
- takeScreenshot: first-real-result
- tapOn:
    id: activation.keep-logging
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: today.repeat-shift
    timeout: 60000
- waitForAnimationToEnd
- assertVisible:
    id: today.repeat-shift
